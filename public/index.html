<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ClauseWise SG</title>
  <meta name="description" content="ClauseWise SG explains contracts in plain words, as a comic or out loud. It is not legal advice.">

  <!-- PWA -->
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#f4f2fb">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ClauseWise SG">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Source+Serif+4:wght@400;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Sans+Tamil:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="/css/styles.css">
  <script>
    // Desktop layout (1024px and wider) or the phone layout, set before the first paint so the
    // page doesn't jump. app.js keeps it up to date. "phone" on a wide screen = a phone-sized frame.
    (function () {
      var v = 'auto';
      try { v = localStorage.getItem('clausewise-view') || 'auto'; } catch (e) {}
      var wide = window.matchMedia && window.matchMedia('(min-width: 1024px)').matches;
      document.documentElement.setAttribute('data-layout', !wide ? 'phone' : v === 'phone' ? 'frame' : 'desktop');
    })();
  </script>
</head>
<body>
  <!-- Phone view on a wide screen: the View switch sits above the phone frame. -->
  <div class="frame-bar" id="frame-bar"></div>
  <div class="app">
    <!-- Desktop layout only: the floating sidebar (drawn by app.js). -->
    <aside class="dt-side" id="dt-side"></aside>
    <!-- Shown on inner screens only (contract, etc.). Top-level screens draw their own title. -->
    <header class="app-header" hidden>
      <button class="round-btn" id="back-btn" type="button" aria-label="Back">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <h1 class="page-title" id="page-title"></h1>
      <div class="header-actions">
        <a class="pill-btn pill-comic" id="comic-btn" href="#/home" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 12h16M12 4v8"/></svg>
          Comic
        </a>
        <button class="round-btn" id="lang-btn" type="button" aria-label="Change language" title="Change language" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>
        </button>
        <button class="round-btn" id="speak-btn" type="button" aria-label="Read aloud" title="Read aloud" aria-pressed="false" hidden>
          <svg class="icon-speak" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9v6h4l5 4V5L9 9z"/><path d="M17.5 9a4.5 4.5 0 0 1 0 6"/></svg>
          <svg class="icon-stop" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor"/></svg>
        </button>
      </div>
    </header>

    <main class="screen" id="screen" tabindex="-1"></main>

    <p class="disclaimer" role="note">ClauseWise SG explains contracts. It is not legal advice.</p>

    <nav class="bottom-nav" aria-label="Main">
      <a href="#/home" data-nav="home">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5L12 4l8 6.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"/></svg>
        <span>Home</span>
      </a>
      <a href="#/contracts" data-nav="contracts">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h7l5 5v12a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v5h5"/></svg>
        <span>Contracts</span>
      </a>
      <a href="#/deadlines" data-nav="deadlines">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>
        <span>Deadlines</span>
      </a>
      <a href="#/experts" data-nav="experts">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1h-8l-5 4v-4H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z"/></svg>
        <span>Experts</span>
      </a>
    </nav>
  </div>

  <!-- Mei, the ClauseWise mascot (approved artwork; sets window.renderMei) -->
  <script src="/js/mei.js"></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
