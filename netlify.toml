[build]
  publish = "public"
  functions = "netlify/functions"

[dev]
  publish = "public"

# The service worker must never be cached, or app updates won't reach phones
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# The privacy policy and terms of use have their own addresses; the app shows them (#/privacy, #/terms)
[[redirects]]
  from = "/privacy"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/index.html"
  status = 200
