[build]
  publish = "public"
  functions = "netlify/functions"

[dev]
  publish = "public"

# The service worker must never be cached, or app updates won't reach phones
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
